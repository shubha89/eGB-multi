[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "egb-multi"
version = "0.1.0"
description = "Numerical experiments for tri-linear LISA response models and eccentric binary extensions."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "jax[cpu]>=0.10",
    "pytdi>=2.1",
]

[project.optional-dependencies]
realistic = [
    "fastgb>=0.0.2",
    "lisaorbits>=3.0",
    "lisagwresponse>=3.0",
    "lisainstrument>=2.3",
    "pytdi>=2.1",
]
test = [
    "pytest>=8",
]
jax = [
    "jax[cpu]>=0.10",
]
precision = [
    "mpmath>=1.3",
]
orbits = [
    "lisaorbits>=3.0",
]
notebook = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
